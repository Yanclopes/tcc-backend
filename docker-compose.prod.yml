# =====================================================================
# Compose de PRODUCAO — usado no EC2. Nao builda a imagem: puxa do GHCR.
# A imagem e publicada pelo GitHub Actions (workflow publish-and-deploy.yml).
#
# Uso:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# =====================================================================

services:
  postgres:
    # Ver nota em docker-compose.yml e o procedimento de migracao de volume
    # em tcc-docs/specs/06-chat-ia.md — trocar a imagem sobre o volume existente
    # corrompe silenciosamente os indices de texto.
    image: pgvector/pgvector:pg16
    container_name: ods_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ods}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ods_secret}
      POSTGRES_DB: ${DB_DATABASE:-ods_quiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ods} -d ${DB_DATABASE:-ods_quiz}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ods_net

  redis:
    image: redis:7-alpine
    container_name: ods_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ods_net

  api:
    image: ghcr.io/yanclopes/tcc-backend:master
    container_name: ods_api
    restart: unless-stopped
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_SYNCHRONIZE: 'false'
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - ods_net

  # Grafana Alloy: coletor local que faz scrape do /metrics (com Basic Auth) e
  # empurra para o Prometheus hospedado no Grafana Cloud via remote_write.
  # Nao expoe nada publicamente — comunicacao com o api e via rede interna.
  alloy:
    image: grafana/alloy:latest
    container_name: ods_alloy
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - ods_net

volumes:
  postgres_data:
  redis_data:
  alloy_data:

networks:
  ods_net:
    driver: bridge
