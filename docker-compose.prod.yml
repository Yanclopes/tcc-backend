# =====================================================================
# Compose de PRODUCAO — usado no EC2. Nao builda a imagem: puxa do GHCR.
#
# LIMITES DE MEMORIA: a instancia e uma t3.micro com 914 MB utilizaveis. Sem
# `mem_limit` nenhum conteiner tem teto, e um vazamento em qualquer um deles faz
# o kernel escolher a vitima do OOM killer — que pode ser o Postgres, derrubando
# o banco por causa de um problema na aplicacao. Os tetos abaixo somam 776 MB e
# existem como guarda-corpo, nao como ponto de operacao: em regime normal os
# quatro conteineres juntos ficam perto de 200 MB.
#
# Cada teto e no minimo o DOBRO do uso observado em regime. Um teto colado no
# uso normal nao protege de nada: so antecipa a morte do processo no primeiro
# pico legitimo.
#
# Os tetos so funcionam como degradacao suave porque a instancia tem swap (o
# user-data cria 2 GB). Sem swap, atingir o teto e morte imediata do processo.
# A imagem e publicada pelo GitHub Actions (workflow publish-and-deploy.yml).
#
# Uso:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# =====================================================================

services:
  postgres:
    mem_limit: 256m  # shared_buffers padrao e 128 MB; o resto e cache e conexoes
    image: postgres:16-alpine
    container_name: ods_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ods}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ods_secret}
      POSTGRES_DB: ${DB_DATABASE:-ods_quiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ods} -d ${DB_DATABASE:-ods_quiz}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ods_net

  redis:
    mem_limit: 64m  # guarda so estado de partida; opera perto de 5 MB
    image: redis:7-alpine
    container_name: ods_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ods_net

  api:
    mem_limit: 360m  # ver NODE_OPTIONS abaixo — o heap do V8 para antes do teto
    image: ghcr.io/yanclopes/tcc-backend:master
    container_name: ods_api
    restart: unless-stopped
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Teto do heap do V8 abaixo do mem_limit do conteiner (360m). Sem isto o
      # V8 dimensiona o heap pela memoria da MAQUINA, ignora o limite do cgroup e
      # e morto pelo OOM killer antes de rodar uma coleta completa.
      NODE_OPTIONS: --max-old-space-size=288
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_SYNCHRONIZE: 'false'
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - ods_net

  # Grafana Alloy: coletor local que faz scrape do /metrics (com Basic Auth) e
  # empurra para o Prometheus hospedado no Grafana Cloud via remote_write.
  # Nao expoe nada publicamente — comunicacao com o api e via rede interna.
  alloy:
    mem_limit: 160m  # opera perto de 80 MB; 96m deixava so 17 MB de folga
    image: grafana/alloy:latest
    container_name: ods_alloy
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - ods_net

volumes:
  postgres_data:
  redis_data:
  alloy_data:

networks:
  ods_net:
    driver: bridge
