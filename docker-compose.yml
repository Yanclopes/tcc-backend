# Ambiente completo de desenvolvimento/execucao: API + PostgreSQL + Redis.
# Subir tudo:            docker compose up -d --build
# Rodar as migrations:   docker compose exec api npm run migration:run
# Popular dados base:    docker compose exec api npm run seed

services:
  postgres:
    image: postgres:16-alpine
    container_name: ods_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ods}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ods_secret}
      POSTGRES_DB: ${DB_DATABASE:-ods_quiz}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ods} -d ${DB_DATABASE:-ods_quiz}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ods_net

  redis:
    image: redis:7-alpine
    container_name: ods_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ods_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ods_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Carrega TODO o .env do host para dentro do container (inclui ADMIN_EMAIL,
    # ADMIN_PASSWORD, JWT_SECRET etc). O bloco `environment` abaixo sobrescreve
    # apenas o que precisa ser diferente do .env local (que aponta pra localhost).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_SYNCHRONIZE: 'false'
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - ods_net

volumes:
  postgres_data:
  redis_data:

networks:
  ods_net:
    driver: bridge
