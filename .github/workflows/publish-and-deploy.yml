name: Publish + Deploy

on:
  push:
    branches: [main, master]

concurrency:
  group: publish-${{ github.ref }}
  # Nao cancelamos jobs em curso: um deploy interrompido pode deixar
  # o EC2 num estado inconsistente.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # e.g. Yanclopes/tcc-backend

jobs:
  build-and-push:
    name: Build + Push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    # Habilita o deploy quando a infra estiver de pe. Cadastre a variavel
    # de repositorio DEPLOY_ENABLED=true em Settings > Variables > Actions
    # depois do primeiro apply do tcc-infra.
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euxo pipefail
            cd /opt/desafio-ods
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d
            # Aguarda a api responder antes de rodar migration
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api node -e "process.exit(0)" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            docker compose -f docker-compose.prod.yml exec -T api npm run migration:run:prod
            docker image prune -f
