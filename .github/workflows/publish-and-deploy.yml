name: Publish + Deploy

on:
  push:
    branches: [main, master]

concurrency:
  group: publish-${{ github.ref }}
  # Nao cancelamos jobs em curso: um deploy interrompido pode deixar
  # o EC2 num estado inconsistente.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # e.g. Yanclopes/tcc-backend

jobs:
  build-and-push:
    name: Build + Push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 (via SSM)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Cadastre a variavel DEPLOY_ENABLED=true (Settings > Variables > Actions)
    # depois do primeiro apply do tcc-infra.
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve instance id (por tag Project=desafio-ods)
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=desafio-ods" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::Nenhuma instancia running encontrada com tag Project=desafio-ods."
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Instancia alvo: $INSTANCE_ID"

      - name: Deploy via SSM Send-Command
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          # Script de deploy — roda no EC2 via SSM.
          # SSM AWS-RunShellScript executa como root em /bin/sh (dash). Nos:
          #   - envolvemos em `sudo -u ubuntu bash -lc` (o repo, .env e docker
          #     estao no contexto do user ubuntu, nao do root);
          #   - -l carrega o env do login (PATH com /usr/bin/docker etc).
          SCRIPT=$(cat <<'DEPLOY_SCRIPT'
          sudo -u ubuntu bash -lc '
          set -euxo pipefail
          cd /opt/desafio-ods
          git pull --ff-only
          docker compose -f docker-compose.prod.yml pull api
          docker compose -f docker-compose.prod.yml up -d
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T api node -e "process.exit(0)" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml exec -T api npm run migration:run:prod
          docker compose -f docker-compose.prod.yml exec -T api npm run seed:prod
          docker image prune -f
          '
          DEPLOY_SCRIPT
          )

          # Empacota o script como JSON pra API do SSM
          PARAMS=$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --comment "deploy from GHA $GITHUB_SHA" \
            --output text --query "Command.CommandId")
          echo "SSM CommandId: $COMMAND_ID"

          # Polling ate concluir (ate 5 min)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] status=$STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command falhou com status $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "===== stdout do deploy ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
